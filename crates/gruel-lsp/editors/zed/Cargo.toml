[package]
name = "zed-gruel"
version = "0.1.0"
edition = "2021"
publish = false

# Standalone package: stop Cargo from inheriting the gruel workspace one level up.
[workspace]

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
zed_extension_api = "0.7"

[profile.release]
opt-level = "z"
lto = true
strip = true
