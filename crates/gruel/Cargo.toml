[package]
name = "gruel"
version.workspace = true
edition.workspace = true
description = "Gruel compiler CLI binary"
build = "build.rs"

[features]
default = ["llvm-dynamic"]
llvm-dynamic = ["gruel-compiler/llvm-dynamic"]
llvm-static = ["gruel-compiler/llvm-static"]

[dependencies]
gruel-cache = { workspace = true }
gruel-compiler.workspace = true
gruel-doc.workspace = true
gruel-fmt.workspace = true
gruel-lsp.workspace = true
gruel-manifest.workspace = true
gruel-rir.workspace = true
gruel-target.workspace = true
gruel-util.workspace = true
clap.workspace = true
lasso.workspace = true
libc.workspace = true
rustc-hash.workspace = true
serde.workspace = true
serde_json.workspace = true
similar.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
walkdir.workspace = true

[dev-dependencies]
tempfile.workspace = true
