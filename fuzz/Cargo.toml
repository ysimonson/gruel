[package]
name = "gruel-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
arbitrary = { version = "1", features = ["derive"] }
libfuzzer-sys = { version = "0.4", features = ["arbitrary-derive"] }
gruel-lexer = { path = "../crates/gruel-lexer" }
gruel-parser = { path = "../crates/gruel-parser" }
gruel-compiler = { path = "../crates/gruel-compiler" }
gruel-util = { path = "../crates/gruel-util" }
tempfile = "3"
# ADR-0090: differential fuzz target uses the tree-sitter Gruel grammar.
# Path-dep on the standalone tree-sitter-gruel/bindings/rust crate so the
# main compiler workspace doesn't pull in tree-sitter.
tree-sitter = "0.25"
tree-sitter-gruel = { path = "../tree-sitter-gruel/bindings/rust" }

[[bin]]
name = "lexer"
path = "fuzz_targets/lexer.rs"
test = false
doc = false

[[bin]]
name = "parser"
path = "fuzz_targets/parser.rs"
test = false
doc = false

[[bin]]
name = "compiler"
path = "fuzz_targets/compiler.rs"
test = false
doc = false


[[bin]]
name = "structured_compiler"
path = "fuzz_targets/structured_compiler.rs"
test = false
doc = false

[[bin]]
name = "structured_invalid"
path = "fuzz_targets/structured_invalid.rs"
test = false
doc = false


[[bin]]
name = "comptime_differential"
path = "fuzz_targets/comptime_differential.rs"
test = false
doc = false

[[bin]]
name = "parser_differential"
path = "fuzz_targets/parser_differential.rs"
test = false
doc = false
